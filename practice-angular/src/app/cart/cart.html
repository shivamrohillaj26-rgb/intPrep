<table class="data-table">
    <thead>
        <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let item of items">
            <td>
                {{item.name}}
            </td>
            <td>
                {{item.price}}
            </td>
            <td>
                <button (click)="addToCart(item)">Add to Cart</button>
            </td>
        </tr>
    </tbody>
</table>

<table class="data-table">
    <thead>
        <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let item of cartItems">
            <td>
                {{item.name}}
            </td>
            <td>
                {{item.price}}
            </td>
            <td>
                <input type="number" [(ngModel)]="item.quantity" (change)="calculateTotal()" />
            </td>
            <td>
                {{item.price * item.quantity}}
            </td>
        </tr>
    </tbody>
    <tfoot>
        <tr>
            <td colspan="3">Total</td>
            <td>{{total}}</td>
            </tr>
        </tfoot> 

</table>
