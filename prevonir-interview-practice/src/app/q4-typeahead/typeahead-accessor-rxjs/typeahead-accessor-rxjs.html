<section class="box">
  <h3>3) Getter/Setter + RxJS + async</h3>
  <p class="tiny">[value]/(input) → setter → Subject → | async</p>

  <input
    placeholder="Search city..."
    [value]="query"
    (input)="query = $any($event.target).value"
  />

  <ul>
    @for (city of results$ | async; track city) {
      <li>{{ city }}</li>
    } @empty {
      <li class="muted">No results</li>
    }
  </ul>
</section>
