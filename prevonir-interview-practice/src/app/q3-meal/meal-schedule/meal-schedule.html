<div class="card">
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Breakfast</th>
        <th>Lunch</th>
        <th>Dinner</th>
      </tr>
    </thead>
    <tbody data-test-id="meal-schedule">
      @for (row of scheduleRows; track row.date) {
        <tr>
          <td data-test-id="date">{{ row.date }}</td>
          <td>
            <ul data-test-id="breakfast-list">
              @for (g of row.breakfast; track $index) {
                <li>{{ g }}</li>
              }
            </ul>
          </td>
          <td>
            <ul data-test-id="lunch-list">
              @for (g of row.lunch; track $index) {
                <li>{{ g }}</li>
              }
            </ul>
          </td>
          <td>
            <ul data-test-id="dinner-list">
              @for (g of row.dinner; track $index) {
                <li>{{ g }}</li>
              }
            </ul>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
