<section class="card">
  <h3>Dashboard (any logged-in role)</h3>
  <p>Protected by <code>jwtAuthGuard</code> only.</p>
  <p>

  <p class="tiny">
    Token (demo): <code>{{ auth.getToken()?.slice(0, 40) }}...</code>
  </p>
</section>
