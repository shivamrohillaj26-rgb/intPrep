<table>

    <thead>
        <tr>
            <th>Date</th>
            <th>Breakfast</th>
            <th>Lunch</th>
            <th>Dinner</th>
        </tr>
    </thead>
    <tbody>
        @for(row of scheduleRows; track row.date){
            <tr>
                <td>{{row.date}}</td>
                <td>{{row.guests.join(', ')}}</td>
                <td>{{row.guests.join(', ')}}</td>
                <td>{{row.guests.join(', ')}}</td>
            </tr>
        }
    </tbody>

</table>
