<div class="file-explorer">
  <div class="file-explorer-header">
    <h1>File Explorer (Option 2: Expansion Service)</h1>
    <div class="actions">
      <button type="button" (click)="expandAll()">Expand All</button>
      <button type="button" (click)="collapseAll()">Collapse All</button>
    </div>
  </div>
  <div class="file-explorer-body">
    @for (node of data; track node.id) {
      <app-node-service [nodes]="node" (onDeleteNode)="deleteNode($event)" />
    }
  </div>
</div>
