<!DOCTYPE html>
<html>
<head>
  <title>Responsive Form</title>
  <!-- h8k design system (provided by HackerRank) -->
  <link href="https://cdn.jsdelivr.net/npm/h8k-design@latest/dist/assets/dist/index.css" rel="stylesheet"/>
  <link rel="shortcut icon" href="https://cdn.jsdelivr.net/npm/h8k-design@latest/dist/assets/img/favicon.ico">
  <script src="https://cdn.jsdelivr.net/npm/h8k-components/dist/h8k-components/h8k-components.esm.js" type="module"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/h8k-components/dist/h8k-components/h8k-components.js"></script>

  <!-- Viewport for responsive behaviour -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- YOUR SOLUTION FILE -->
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <!-- HackerRank navbar (read-only) -->
  <h8k-navbar header="Responsive Form"></h8k-navbar>

  <div class="my-50 mx-auto">
    <div class="container">

      <!-- =============================================
           THIS IS YOUR FORM — the one you must style
           Each input has a class name that you target
           in style.css using grid-column: span X
           ============================================= -->
      <div class="layout">
        <h2>Your Form</h2>
        <form>
          <!-- Row 1: 3 equal columns -->
          <input placeholder="First name"    class="first-name" />
          <input placeholder="Last name"     class="last-name" />
          <input placeholder="Age"           class="age" type="number" />

          <!-- Row 2: full width -->
          <input placeholder="Address"       class="address" />

          <!-- Row 3: 2 equal columns -->
          <input placeholder="Place of work" class="place-of-work" />
          <input placeholder="Job title"     class="job-title" />

          <!-- Row 4: 2 equal columns -->
          <input placeholder="Phone number"  class="phone-number" />
          <input placeholder="Skype"         class="skype" />

          <!-- Row 5: full width -->
          <button type="submit">Submit</button>
        </form>
      </div>

      <!-- =============================================
           EXPECTED RESULT — shown alongside your form
           This is the reference/template (read-only)
           The test compares your .layout form against
           this .template-form to check correctness
           ============================================= -->
      <div class="template">
        <h2>Expected Result</h2>
        <div class="template-form">
          <input placeholder="First name" />
          <input placeholder="Last name" />
          <input placeholder="Age" type="number" />
          <input placeholder="Address" />
          <input placeholder="Place of work" />
          <input placeholder="Job title" />
          <input placeholder="Phone number" />
          <input placeholder="Skype" />
          <button type="submit">Submit</button>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
